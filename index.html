<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OCR 스파이크</title>
<script type="importmap">{"imports":{"onnxruntime-web":"https://cdn.jsdelivr.net/npm/onnxruntime-web@1.26.0/dist/ort.all.bundle.min.mjs","ppu-ocv/web":"https://cdn.jsdelivr.net/npm/ppu-ocv@3.3.0/index.web.js","ppu-ocv/canvas-web":"https://cdn.jsdelivr.net/npm/ppu-ocv@3.3.0/index.canvas-web.js"}}</script>
<style>
body{font-family:sans-serif;margin:8px;background:#111;color:#eee}
button,input{margin:2px;padding:12px;font-size:16px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:8px;display:none}
.big{font-size:20px;padding:16px 28px;background:#2a7;color:#fff;border:0;border-radius:8px}
#stage{position:relative;display:inline-block;max-width:100%;line-height:0;background:#000}
#src{max-width:100%;max-height:60vh;width:auto;height:auto}
#ov{position:absolute;left:0;top:0;width:100%;height:100%;cursor:pointer}
#src{display:block}
textarea{width:100%;height:160px;background:#222;color:#eee;font-family:monospace}
#thumb{max-height:80px;vertical-align:middle;background:#333}
</style></head><body>
<div>
<button id="btnCam">카메라</button><button id="btnSample">샘플 이미지</button>
<input type="file" id="file" accept="image/*">
</div>
<details id="settings"><summary>설정</summary>
<div>엔진 <select id="selEngine"><option value="google">Google Vision</option><option value="local">로컬(PaddleOCR)</option></select></div>
<div id="gnote">선택한 블록 이미지만 Google Cloud Vision으로 전송됩니다.</div>
<div>API 키 <input type="password" id="keyIn" autocomplete="off" placeholder="API 키"><button id="keySave">저장</button> <span id="keyInfo"></span></div>
</details>
<div id="status">모델 로딩 중…</div>
<div id="camctl" style="display:none"><button id="btnShoot" class="big">찍기</button><button id="btnRetake" class="big" style="display:none">다시 찍기</button> <label><input type="checkbox" id="chkLive">실시간 박스(실험)</label></div>
<div id="stage"><canvas id="src"></canvas><video id="vid" playsinline muted style="display:none"></video><canvas id="ov"></canvas></div>
<div id="toast"></div>
<div><img id="thumb" alt=""> <span id="jobinfo"></span></div>
<div><button id="btnCopy">전체 복사</button><button id="btnUndo">마지막 취소</button><button id="btnClear">초기화</button></div>
<textarea id="out" placeholder="인식 결과가 여기에 쌓입니다"></textarea>
<script type="module">
import { PaddleOcrService } from "https://cdn.jsdelivr.net/npm/ppu-paddle-ocr@6.7.1/web/index.js";

// ===== Paragraph grouping (pure function) =====
function median(a){ if(!a.length) return 0; const s=[...a].sort((x,y)=>x-y); return s[s.length>>1]; }
function groupBlocks(boxes){
  const n=boxes.length; if(!n) return [];
  const p=[...Array(n).keys()];
  const find=i=>{ while(p[i]!==i){ p[i]=p[p[i]]; i=p[i]; } return i; };
  const medH=median(boxes.map(b=>b.height));
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
    const a=boxes[i], b=boxes[j];
    const gap=Math.max(0, Math.max(a.y,b.y)-Math.min(a.y+a.height,b.y+b.height));
    if(gap>0.8*Math.min(a.height,b.height)) continue;
    const overlap=Math.min(a.x+a.width,b.x+b.width)-Math.max(a.x,b.x)>0;
    if(!(overlap || Math.abs(a.x-b.x)<=2*medH)) continue;
    p[find(i)]=find(j);
  }
  const g=new Map();
  boxes.forEach((b,i)=>{ const r=find(i); if(!g.has(r)) g.set(r,[]); g.get(r).push(b); });
  let blocks=[...g.values()].map(m=>{
    const x0=Math.min(...m.map(b=>b.x)), y0=Math.min(...m.map(b=>b.y));
    const x1=Math.max(...m.map(b=>b.x+b.width)), y1=Math.max(...m.map(b=>b.y+b.height));
    return {x:x0,y:y0,width:x1-x0,height:y1-y0,count:m.length};
  });
  const medA=median(blocks.map(b=>b.width*b.height));
  return blocks.filter(b=>b.width*b.height>=0.2*medA);
}
// ===== Tracker: IoU match with previous frame + smoothing =====
function iou(a,b){
  const w=Math.min(a.x+a.width,b.x+b.width)-Math.max(a.x,b.x), h=Math.min(a.y+a.height,b.y+b.height)-Math.max(a.y,b.y);
  if(w<=0||h<=0) return 0; const i=w*h; return i/(a.width*a.height+b.width*b.height-i);
}
function track(prev,cur,f=0.5){
  const used=new Set();
  return cur.map(c=>{
    let best=-1,bi=0;
    prev.forEach((p,i)=>{ if(used.has(i)) return; const v=iou(p,c); if(v>bi){bi=v;best=i;} });
    if(best>=0 && bi>0.5){ used.add(best); const p=prev[best];
      const s=k=>p[k]*(1-f)+c[k]*f; return {...c,x:s('x'),y:s('y'),width:s('width'),height:s('height')}; }
    return c;
  });
}

// ===== App =====
const $=id=>document.getElementById(id);
const src=$('src'), ov=$('ov'), vid=$('vid'), out=$('out'), statusEl=$('status');
const sctx=src.getContext('2d'), octx=ov.getContext('2d');
const work=document.createElement('canvas'), wctx=work.getContext('2d');
// Recognition engines: same shape, recognize(canvas) -> [{text, box, confidence}]
const localEngine={ name:'local', recognize: async(canvas)=>{
  const r=await svc.recognize(canvas); window.__lastRec=r;
  return r.results||(r.lines||[]).flat(); } };
const med=a=>{ const x=[...a].sort((p,q)=>p-q); return x.length?x[x.length>>1]:0; };
const googleEngine={ name:'google', recognize: async(canvas)=>{
  const key=localStorage.getItem('rvt.visionKey'); if(!key) throw new Error('API 키가 없습니다');
  let c=canvas, k=1; const L=Math.max(canvas.width,canvas.height);
  if(L>2048){ k=2048/L; c=document.createElement('canvas'); c.width=Math.round(canvas.width*k); c.height=Math.round(canvas.height*k); c.getContext('2d').drawImage(canvas,0,0,c.width,c.height); }
  const b64=c.toDataURL('image/jpeg',0.92).split(',')[1];
  const resp=await fetch('https://vision.googleapis.com/v1/images:annotate?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({requests:[{image:{content:b64},features:[{type:'DOCUMENT_TEXT_DETECTION'}],imageContext:{languageHints:['en','ko']}}]})});
  const j=await resp.json().catch(()=>({}));
  if(!resp.ok) throw new Error((j.error&&j.error.message)||('HTTP '+resp.status));
  const r0=(j.responses||[])[0]||{}; if(r0.error) throw new Error(r0.error.message);
  // Rebuild lines from word geometry (do not trust fullTextAnnotation.text ordering)
  const words=[];
  for(const pg of (r0.fullTextAnnotation?.pages||[])) for(const bl of pg.blocks||[]) for(const pa of bl.paragraphs||[]) for(const w of pa.words||[]){
    const sy=w.symbols||[]; const text=sy.map(x=>x.text).join(''); const vs=(w.boundingBox?.vertices||[]).map(v=>({x:(v.x||0)/k,y:(v.y||0)/k}));
    if(!vs.length||!text) continue;
    const x0=Math.min(...vs.map(v=>v.x)),x1=Math.max(...vs.map(v=>v.x)),y0=Math.min(...vs.map(v=>v.y)),y1=Math.max(...vs.map(v=>v.y));
    const br=sy.length?sy[sy.length-1].property?.detectedBreak?.type:null;
    words.push({text,x:x0,y:y0,w:x1-x0,h:y1-y0,yc:(y0+y1)/2,conf:w.confidence??0,sp:['SPACE','SURE_SPACE','EOL_SURE_SPACE','LINE_BREAK'].includes(br)});
  }
  const mh=med(words.map(w=>w.h)); words.sort((a,b)=>a.yc-b.yc);
  const rows=[];
  for(const w of words){ const r=rows[rows.length-1];
    if(r && Math.abs(w.yc-med(r.map(q=>q.yc)))<=0.5*mh) r.push(w); else rows.push([w]); }
  const out=[];
  for(const r of rows){
    r.sort((a,b)=>a.x-b.x);
    // gutter: 1-3 digit first word in leftmost 10% with a gap > 1 word-height
    if(r.length>1 && /^\d{1,3}$/.test(r[0].text) && r[0].x<canvas.width*0.15 && r[1].x-(r[0].x+r[0].w)>0.5*r[0].h) r.shift(); // relaxed from 10%/1.0h: gutter sits ~12% in after crop margin, gap is small
    if(!r.length) continue;
    let t=r[0].text;
    for(let i=1;i<r.length;i++){ const gap=r[i].x-(r[i-1].x+r[i-1].w); t+=(gap>0.25*r[i].h||r[i-1].sp?' ':'')+r[i].text; }
    const x0=Math.min(...r.map(w=>w.x)),y0=Math.min(...r.map(w=>w.y)),x1=Math.max(...r.map(w=>w.x+w.w)),y1=Math.max(...r.map(w=>w.y+w.h));
    out.push({text:t,box:{x:x0,y:y0,width:x1-x0,height:y1-y0},confidence:r.reduce((a,w)=>a+w.conf,0)/r.length});
  }
  return out; } };
let engine=localEngine;
function keyInfo(){ const k=localStorage.getItem('rvt.visionKey'); $('keyInfo').textContent=k?('키 저장됨 (끝 4자리 ****'+k.slice(-4)+')'):'키 없음'; }
function setEngine(n){ engine=n==='google'?googleEngine:localEngine; $('selEngine').value=n; $('gnote').style.display=n==='google'?'':'none'; }
$('keySave').onclick=()=>{ const v=$('keyIn').value.trim(); if(v){ localStorage.setItem('rvt.visionKey',v); $('keyIn').value=''; } keyInfo(); };
$('selEngine').onchange=e=>setEngine(e.target.value);
keyInfo(); setEngine(localStorage.getItem('rvt.visionKey')?'google':'local');
let svc=null, mode='none'; // 'live' | 'still' | 'none'
let stillCv=null, srcW=0, srcH=0, currentBlocks=[], prevBlocks=[], detMs=0, fps=0, lastT=0, busy=false, addedN=0;
let stream=null;

function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(toast.h); toast.h=setTimeout(()=>t.style.display='none',1500); }
function sizeCanvases(w,h){ srcW=w; srcH=h; src.width=w; src.height=h; ov.width=w; ov.height=h; }
function stopCam(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } $('camctl').style.display='none'; }

// Detect once on a full-res canvas: scale to <=1600px wide, maxSideLength 960
async function detectStill(cv){
  const sc=Math.min(1,1600/cv.width); work.width=Math.round(cv.width*sc); work.height=Math.round(cv.height*sc);
  wctx.drawImage(cv,0,0,work.width,work.height);
  const t0=performance.now(); const r=await svc.detect(work,{maxSideLength:960}); detMs=performance.now()-t0;
  return groupBlocks(r.boxes||[]).map(b=>({...b,added:0,src:{x:b.x/sc,y:b.y/sc,width:b.width/sc,height:b.height/sc}}));
}
async function freeze(el,w,h){
  if(!svc) return;
  busy=true; // pause live loop
  const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(el,0,0,w,h);
  stillCv=c; mode='still'; sizeCanvases(w,h); sctx.drawImage(c,0,0);
  statusEl.textContent='검출 중…';
  try{ currentBlocks=await detectStill(c); statusEl.textContent=`검출 ${detMs.toFixed(0)} ms · 블록 ${currentBlocks.length}개`; }
  catch(e){ currentBlocks=[]; statusEl.textContent='검출 오류: '+e.message; }
  draw(); busy=false;
  if(stream){ $('btnShoot').style.display='none'; $('btnRetake').style.display=''; }
}
function shoot(){
  if(mode==='live' && vid.videoWidth) return freeze(vid,vid.videoWidth,vid.videoHeight);
  if(mode==='still' && stillCv) return freeze(stillCv,stillCv.width,stillCv.height); // re-run on the current still
}
function retake(){ mode='live'; currentBlocks=[]; prevBlocks=[]; octx.clearRect(0,0,ov.width,ov.height);
  $('btnShoot').style.display=''; $('btnRetake').style.display='none'; statusEl.textContent='카메라 미리보기. 글자를 맞추고 [찍기]를 누르세요.'; }
$('btnShoot').onclick=shoot; $('btnRetake').onclick=retake;

$('btnSample').onclick=()=>loadImage('sample.jpg');
$('file').onchange=e=>{ const f=e.target.files[0]; if(f) loadImage(URL.createObjectURL(f)); };
function loadImage(url){
  stopCam(); mode='none';
  const im=new Image(); im.onload=()=>freeze(im,im.naturalWidth,im.naturalHeight);
  im.onerror=()=>statusEl.textContent='이미지를 불러오지 못했습니다.';
  im.src=url;
}
$('btnCam').onclick=async()=>{
  try{
    if(!navigator.mediaDevices?.getUserMedia) throw new Error('이 브라우저는 카메라를 지원하지 않습니다 (HTTPS 필요)');
    stopCam();
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:false});
    vid.srcObject=stream; await vid.play(); $('camctl').style.display='';
    sizeCanvases(vid.videoWidth,vid.videoHeight); retake();
  }catch(e){ statusEl.textContent='카메라 오류: '+(e.message||e.name)+' (권한을 확인하세요)'; }
};

// Preview loop (+ optional experimental live boxes)
async function loop(){
  requestAnimationFrame(loop);
  if(mode!=='live'||!vid.videoWidth) return;
  if(vid.videoWidth!==srcW||vid.videoHeight!==srcH) sizeCanvases(vid.videoWidth,vid.videoHeight);
  sctx.drawImage(vid,0,0);
  if(!$('chkLive').checked||busy||!svc) { if(!$('chkLive').checked) octx.clearRect(0,0,ov.width,ov.height); return; }
  busy=true;
  try{
    const sc=1280/srcW; work.width=1280; work.height=Math.round(srcH*sc); wctx.drawImage(vid,0,0,work.width,work.height);
    const t0=performance.now(); const r=await svc.detect(work,{maxSideLength:640}); detMs=performance.now()-t0;
    prevBlocks=track(prevBlocks,groupBlocks(r.boxes||[]),0.5);
    if(mode==='live'){ currentBlocks=prevBlocks.map(b=>({...b,added:0,src:{x:b.x/sc,y:b.y/sc,width:b.width/sc,height:b.height/sc}}));
      const now=performance.now(); if(lastT) fps=fps?fps*0.7+0.3*1000/(now-lastT):1000/(now-lastT); lastT=now; draw();
      statusEl.textContent=`검출 ${detMs.toFixed(0)} ms · ${fps.toFixed(1)} fps · 블록 ${currentBlocks.length}개`; }
  }catch(e){ statusEl.textContent='검출 오류: '+e.message; }
  busy=false;
}
function draw(){
  octx.clearRect(0,0,ov.width,ov.height);
  const fs=Math.max(14,srcW/40);
  octx.lineWidth=Math.max(2,srcW/400); octx.font=`bold ${fs}px sans-serif`;
  currentBlocks.forEach(b=>{ const s=b.src;
    octx.strokeStyle=b.added?'#fa0':'#0f0'; octx.fillStyle=b.added?'rgba(255,170,0,0.35)':'rgba(0,255,0,0.10)';
    octx.fillRect(s.x,s.y,s.width,s.height); octx.strokeRect(s.x,s.y,s.width,s.height);
    if(b.added){ octx.fillStyle='#fff'; octx.strokeStyle='#000'; octx.lineWidth=4; octx.strokeText(String(b.added),s.x+6,s.y+fs); octx.fillText(String(b.added),s.x+6,s.y+fs); octx.lineWidth=Math.max(2,srcW/400); }
  });
}
// Canvases are displayed with a plain CSS scale, so CSS px -> source px is a ratio
ov.addEventListener('click',e=>{
  if(mode!=='still') return;
  const r=ov.getBoundingClientRect(); const px=(e.clientX-r.left)*srcW/r.width, py=(e.clientY-r.top)*srcH/r.height;
  let hit=-1,ha=Infinity;
  currentBlocks.forEach((b,i)=>{ const s=b.src; if(px>=s.x&&px<=s.x+s.width&&py>=s.y&&py<=s.y+s.height&&s.width*s.height<ha){ha=s.width*s.height;hit=i;} });
  if(hit>=0) tapBlock(hit);
});

// ===== Job queue =====
let jobN=0; const jobs=[]; let running=false; const texts=[];
function render(){ out.value=texts.map(t=>t.text??t.ph).join('\n'); }
function tapBlock(i){
  const b=currentBlocks[i]; if(!b||mode!=='still') return;
  if(b.added){ toast('이미 추가됨'); return; }
  b.added=++addedN; draw();
  const s=b.src, mx=s.width*0.12, my=s.height*0.12;
  const x=Math.max(0,s.x-mx), y=Math.max(0,s.y-my);
  const w=Math.min(srcW,s.x+s.width+mx)-x, h=Math.min(srcH,s.y+s.height+my)-y;
  const c=document.createElement('canvas'); c.width=Math.round(w); c.height=Math.round(h);
  c.getContext('2d').drawImage(stillCv,x,y,w,h,0,0,c.width,c.height); // crop from full-res still
  const id=++jobN; const entry={id,ph:`[인식 중 #${id}]`,text:null,block:b};
  texts.push(entry); render(); jobs.push({entry,c}); pump();
}
async function pump(){
  if(running) return; running=true;
  while(jobs.length){
    const {entry,c}=jobs.shift();
    if(!texts.includes(entry)) continue;
    $('thumb').src=c.toDataURL('image/jpeg',0.7);
    const t0=performance.now(), eg=engine, lbl=eg.name==='google'?'Google 인식':'인식';
    try{ entry.text=assemble(await eg.recognize(c),c.width); $('jobinfo').textContent=`#${entry.id} ${lbl} ${(performance.now()-t0).toFixed(0)} ms`; }
    catch(e){ entry.text=`[실패 #${entry.id}]`; $('jobinfo').textContent=(eg.name==='google'?'Google OCR 실패: ':'인식 실패: ')+e.message; }
    render();
  }
  running=false;
}
function assemble(res,cw){
  if(!res.length) return '';
  // box coords may be in a resized space, so use detected text extent for the 8% zone
  const L=Math.min(...res.map(r=>r.box.x)), R=Math.max(...res.map(r=>r.box.x+r.box.width));
  const items=res.filter(r=>!(/^\d{1,3}$/.test(r.text.trim()) && r.box.x+r.box.width/2<L+(R-L)*0.08+r.box.width));
  items.sort((a,b)=>(a.box.y+a.box.height/2)-(b.box.y+b.box.height/2));
  const rows=[];
  for(const it of items){
    const cy=it.box.y+it.box.height/2, row=rows[rows.length-1];
    if(row && Math.abs(cy-row.cy)<=it.box.height/2){ row.items.push(it); row.cy=(row.cy*(row.items.length-1)+cy)/row.items.length; }
    else rows.push({cy,items:[it]});
  }
  return rows.map(r=>r.items.sort((a,b)=>a.box.x-b.box.x).map(i=>i.text).join(' ')).join('\n');
}
$('btnCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(out.value); toast('복사했습니다.'); }catch(e){ toast('복사 실패: '+e.message); } };
$('btnUndo').onclick=()=>{ const t=texts.pop(); if(t){ t.block.added=0; } render(); if(mode==='still') draw(); };
$('btnClear').onclick=()=>{ texts.length=0; jobs.length=0; currentBlocks.forEach(b=>b.added=0); addedN=0; render(); if(mode==='still') draw(); };

window.__spike={ setEngine, getBlocks:()=>currentBlocks, tapBlock, shoot, getText:()=>out.value, stats:()=>({detMs,fps,blocks:currentBlocks.length}) };
try{ svc=new PaddleOcrService(); await svc.initialize(); statusEl.textContent='준비 완료. 카메라 또는 이미지를 선택하세요.'; window.__spikeReady=true; loop(); }
catch(e){ statusEl.textContent='모델 초기화 실패: '+e.message; }
</script></body></html>
