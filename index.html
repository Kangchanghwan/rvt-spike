<script type="module">
import { PaddleOcrService } from "https://cdn.jsdelivr.net/npm/ppu-paddle-ocr@6.7.1/web/index.js";

// ===== Line boxes (no paragraph grouping) =====
function median(a){ if(!a.length) return 0; const s=[...a].sort((x,y)=>x-y); return s[s.length>>1]; }
function lineBoxes(boxes){ const m=median(boxes.map(b=>b.width*b.height)); return boxes.filter(b=>b.width*b.height>=0.2*m); }
function mkLine(b,sc){ const s={x:b.x/sc,y:b.y/sc,width:b.width/sc,height:b.height/sc}; return {...s,src:s,added:0,sel:false}; }

// ===== Preprocess (pure): crop union of selected lines, deskew, contrast, scale, glare check =====
function prepareForOcr(still, lines, opts={}){
  const fix=opts.fix!==false, mh=median(lines.map(l=>l.height)), m=0.6*mh;
  const X0=Math.max(0,Math.floor(Math.min(...lines.map(l=>l.x))-m)), Y0=Math.max(0,Math.floor(Math.min(...lines.map(l=>l.y))-m));
  const X1=Math.min(still.width,Math.ceil(Math.max(...lines.map(l=>l.x+l.width))+m)), Y1=Math.min(still.height,Math.ceil(Math.max(...lines.map(l=>l.y+l.height))+m));
  const cw=X1-X0, ch=Y1-Y0, mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
  const crop=mk(cw,ch); crop.getContext('2d').drawImage(still,X0,Y0,cw,ch,0,0,cw,ch);
  // analysis copy <= 800px wide
  const ds=Math.min(1,800/cw), sw=Math.max(2,Math.round(cw*ds)), sh=Math.max(2,Math.round(ch*ds));
  const sm=mk(sw,sh), smx=sm.getContext('2d',{willReadFrequently:true}); smx.drawImage(crop,0,0,sw,sh);
  const d=smx.getImageData(0,0,sw,sh).data, n=sw*sh, gray=new Float32Array(n), hist=new Uint32Array(256);
  let glareN=0;
  for(let i=0;i<n;i++){ const r=d[4*i],g=d[4*i+1],b=d[4*i+2]; const L=0.299*r+0.587*g+0.114*b; gray[i]=L; hist[Math.round(L)]++;
    if(L>=250 && Math.max(r,g,b)-Math.min(r,g,b)<=20) glareN++; }
  const glare=glareN/n>=0.015;
  const pct=p=>{ let a=0; for(let v=0;v<256;v++){ a+=hist[v]; if(a>=p*n) return v; } return 255; };
  const p1=pct(0.01), p99=pct(0.99);
  // border median colour for fill
  const bc=[[],[],[]]; for(let x=0;x<sw;x++) for(const y of [0,sh-1]) for(let c=0;c<3;c++) bc[c].push(d[4*(y*sw+x)+c]);
  for(let y=0;y<sh;y++) for(const x of [0,sw-1]) for(let c=0;c<3;c++) bc[c].push(d[4*(y*sw+x)+c]);
  const fill=bc.map(median);
  // deskew: maximise variance of row-sum projection of the vertical-gradient map
  let rot=0;
  if(fix){
    const e=mk(sw,sh), ex=e.getContext('2d'), id=ex.createImageData(sw,sh);
    for(let y=0;y<sh;y++) for(let x=0;x<sw;x++){ const a=gray[Math.min(sh-1,y+1)*sw+x], b=gray[Math.max(0,y-1)*sw+x], v=Math.min(255,Math.abs(a-b)*2); const o=4*(y*sw+x); id.data[o]=id.data[o+1]=id.data[o+2]=v; id.data[o+3]=255; }
    ex.putImageData(id,0,0);
    const t=mk(sw,sh), tx=t.getContext('2d',{willReadFrequently:true}); let best=-1;
    for(let a=-8;a<=8.0001;a+=0.25){
      tx.fillStyle='#000'; tx.fillRect(0,0,sw,sh); tx.save(); tx.translate(sw/2,sh/2); tx.rotate(a*Math.PI/180); tx.drawImage(e,-sw/2,-sh/2); tx.restore();
      const q=tx.getImageData(0,0,sw,sh).data, rs=new Float64Array(sh); let tot=0;
      for(let y=0;y<sh;y++){ let s=0; for(let x=0;x<sw;x++) s+=q[4*(y*sw+x)]; rs[y]=s; tot+=s; }
      const mu=tot/sh; let v=0; for(let y=0;y<sh;y++) v+=(rs[y]-mu)*(rs[y]-mu);
      if(v>best){ best=v; rot=a; }
    }
    if(Math.abs(rot)<0.3) rot=0;
  }
  const rr=rot*Math.PI/180, cs=Math.cos(rr), sn=Math.sin(rr);
  const nw=Math.abs(cw*cs)+Math.abs(ch*sn), nh=Math.abs(cw*sn)+Math.abs(ch*cs);
  let s=1;
  if(fix && mh<32){ s=40/mh; s=Math.min(s,3000/Math.max(nw,nh)); if(s<1) s=1; }
  const out=mk(Math.round(nw*s),Math.round(nh*s)), ox=out.getContext('2d',{willReadFrequently:true});
  ox.fillStyle='rgb('+fill.join(',')+')'; ox.fillRect(0,0,out.width,out.height);
  ox.imageSmoothingQuality='high'; ox.save(); ox.scale(out.width/nw,out.height/nh); ox.translate(nw/2,nh/2); ox.rotate(rr); ox.drawImage(crop,-cw/2,-ch/2); ox.restore();
  let contrast=false;
  if(fix && (p99-p1)<160 && p99-p1>=8){
    contrast=true; const im=ox.getImageData(0,0,out.width,out.height), q=im.data, lut=new Uint8Array(256);
    for(let v=0;v<256;v++) lut[v]=Math.max(0,Math.min(255,Math.round((v-p1)*255/(p99-p1))));
    for(let i=0;i<q.length;i+=4){ q[i]=lut[q[i]]; q[i+1]=lut[q[i+1]]; q[i+2]=lut[q[i+2]]; }
    ox.putImageData(im,0,0);
  }
  const sx=out.width/nw; // maps (cropped, rotated) -> output; used inversely below
  const toStill=(qx,qy)=>{ const ux=qx/sx-nw/2, uy=qy/(out.height/nh)-nh/2; return {x:ux*cs+uy*sn+cw/2+X0, y:-ux*sn+uy*cs+ch/2+Y0}; };
  const parts=[]; if(rot) parts.push('기울기 '+(-rot).toFixed(1)+'° 보정'); if(contrast) parts.push('대비 보정'); if(s>1.05) parts.push(s.toFixed(1)+'배 확대');
  if(glare) parts.push('빛 반사 의심');
  return { canvas:out, transform:{toStill,rot,scale:s,origin:[X0,Y0]}, report:{angle:-rot,contrast,scale:s,glare,text:parts.join(' · ')||'보정 없음'} };
}

// ===== App =====
const $=id=>document.getElementById(id);
const src=$('src'), ov=$('ov'), vid=$('vid'), out=$('out'), statusEl=$('status');
const sctx=src.getContext('2d'), octx=ov.getContext('2d');
const work=document.createElement('canvas'), wctx=work.getContext('2d');
// Recognition engines: same shape, recognize(canvas) -> [{text, box, confidence}]
const localEngine={ name:'local', recognize: async(canvas)=>{
  const r=await svc.recognize(canvas); window.__lastRec=r;
  return r.results||(r.lines||[]).flat(); } };
const med=a=>{ const x=[...a].sort((p,q)=>p-q); return x.length?x[x.length>>1]:0; };
const googleEngine={ name:'google', recognize: async(canvas,opts={})=>{
  const key=localStorage.getItem('rvt.visionKey'); if(!key) throw new Error('API 키가 없습니다');
  let c=canvas, k=1; const L=Math.max(canvas.width,canvas.height);
  if(L>2048){ k=2048/L; c=document.createElement('canvas'); c.width=Math.round(canvas.width*k); c.height=Math.round(canvas.height*k); c.getContext('2d').drawImage(canvas,0,0,c.width,c.height); }
  const b64=c.toDataURL('image/jpeg',0.92).split(',')[1];
  const resp=await fetch('https://vision.googleapis.com/v1/images:annotate?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},
    // Send the full page URL as Referer so the key's website restriction (path /rvt-spike/*) matches.
    referrerPolicy:'no-referrer-when-downgrade',
    body:JSON.stringify({requests:[{image:{content:b64},features:[{type:'DOCUMENT_TEXT_DETECTION'}],imageContext:{languageHints:['en','ko']}}]})});
  const j=await resp.json().catch(()=>({}));
  if(!resp.ok) throw new Error((j.error&&j.error.message)||('HTTP '+resp.status));
  const r0=(j.responses||[])[0]||{}; if(r0.error) throw new Error(r0.error.message);
  // Rebuild lines from word geometry (do not trust fullTextAnnotation.text ordering)
  let words=[]; const boxOf=bb=>{ const vs=bb?.vertices||[]; if(!vs.length) return null; const xs=vs.map(v=>(v.x||0)/k), ys=vs.map(v=>(v.y||0)/k); const y0=Math.min(...ys),y1=Math.max(...ys); return {x0:Math.min(...xs),x1:Math.max(...xs),y0,y1,h:y1-y0}; };
  for(const pg of (r0.fullTextAnnotation?.pages||[])) for(const bl of pg.blocks||[]) for(const pa of bl.paragraphs||[]) for(const w of pa.words||[]){
    const sy=w.symbols||[], wb=boxOf(w.boundingBox); if(!sy.length||!wb) continue;
    const sb=sy.map(x=>boxOf(x.boundingBox)), ok=sb.every(Boolean), groups=[];
    if(ok){ let cur=[0]; for(let i=1;i<sy.length;i++){ if(sb[i].x0-sb[i-1].x1>0.5*wb.h){ groups.push(cur); cur=[]; } cur.push(i); } groups.push(cur); } // split glued gutter numbers
    else groups.push(sy.map((_,i)=>i));
    for(const g of groups){
      const bb=ok?{x0:Math.min(...g.map(i=>sb[i].x0)),x1:Math.max(...g.map(i=>sb[i].x1)),y0:Math.min(...g.map(i=>sb[i].y0)),y1:Math.max(...g.map(i=>sb[i].y1))}:wb;
      const br=sy[g[g.length-1]].property?.detectedBreak?.type;
      words.push({text:g.map(i=>sy[i].text).join(''),x:bb.x0,y:bb.y0,w:bb.x1-bb.x0,h:bb.y1-bb.y0,yc:(bb.y0+bb.y1)/2,conf:w.confidence??0,sp:['SPACE','SURE_SPACE','EOL_SURE_SPACE','LINE_BREAK'].includes(br)});
    }
  }
  if(opts.keep) words=words.filter(w=>opts.keep(w.x+w.w/2,w.yc));
  const mh=med(words.map(w=>w.h)); words.sort((a,b)=>a.yc-b.yc);
  const rows=[];
  for(const w of words){ const r=rows[rows.length-1];
    if(r && Math.abs(w.yc-med(r.map(q=>q.yc)))<=0.5*mh) r.push(w); else rows.push([w]); }
  const out=[];
  for(const r of rows){
    r.sort((a,b)=>a.x-b.x);
    // gutter: 1-3 digit first word in leftmost 10% with a gap > 1 word-height
    if(r.length>1 && /^\d{1,3}$/.test(r[0].text) && r[0].x<canvas.width*0.15 && r[1].x-(r[0].x+r[0].w)>0.5*r[0].h) r.shift(); // relaxed from 10%/1.0h: gutter sits ~12% in after crop margin, gap is small
    if(!r.length) continue;
    let t=r[0].text;
    for(let i=1;i<r.length;i++){ const gap=r[i].x-(r[i-1].x+r[i-1].w); t+=(gap>0.25*r[i].h||r[i-1].sp?' ':'')+r[i].text; }
    const x0=Math.min(...r.map(w=>w.x)),y0=Math.min(...r.map(w=>w.y)),x1=Math.max(...r.map(w=>w.x+w.w)),y1=Math.max(...r.map(w=>w.y+w.h));
    out.push({text:t,box:{x:x0,y:y0,width:x1-x0,height:y1-y0},confidence:r.reduce((a,w)=>a+w.conf,0)/r.length});
  }
  return out; } };
let engine=localEngine;
function keyInfo(){ const k=localStorage.getItem('rvt.visionKey'); $('keyInfo').textContent=k?('키 저장됨 (끝 4자리 ****'+k.slice(-4)+')'):'키 없음'; }
function setEngine(n){ setTimeout(updWarn,0); engine=n==='google'?googleEngine:localEngine; $('selEngine').value=n; $('gnote').style.display=n==='google'?'':'none'; }
$('keySave').onclick=()=>{ const v=$('keyIn').value.trim(); if(v){ localStorage.setItem('rvt.visionKey',v); $('keyIn').value=''; } keyInfo(); updWarn(); };
$('selEngine').onchange=e=>setEngine(e.target.value);
keyInfo(); if(localStorage.getItem('rvt.visionKey')) setEngine('google'); else { setEngine('google'); $('settings').open=true; }
let svc=null, mode='none'; // 'live' | 'still' | 'none'
let stillCv=null, srcW=0, srcH=0, currentLines=[], prevBlocks=[], detMs=0, fps=0, lastT=0, busy=false, addedN=0;
let stream=null, photoInfo='';
const effEngine=()=> (engine===googleEngine && !localStorage.getItem('rvt.visionKey')) ? localEngine : engine;
const engLabel=()=>'엔진: '+(effEngine()===googleEngine?'Google Vision':'로컬');
function updWarn(){ $('warn').style.display=(engine===googleEngine&&!localStorage.getItem('rvt.visionKey'))?'':'none'; }
function setStat(extra){ statusEl.textContent=(photoInfo?photoInfo+' · ':'')+extra+' · '+engLabel(); updWarn(); }

function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(toast.h); toast.h=setTimeout(()=>t.style.display='none',1500); }
function sizeCanvases(w,h){ srcW=w; srcH=h; src.width=w; src.height=h; ov.width=w; ov.height=h; }
function stopCam(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } $('camctl').style.display='none'; }

// Detect once on a full-res canvas: scale to <=1600px wide, maxSideLength 960
async function detectStill(cv){
  const sc=Math.min(1,1600/cv.width); work.width=Math.round(cv.width*sc); work.height=Math.round(cv.height*sc);
  wctx.drawImage(cv,0,0,work.width,work.height);
  const t0=performance.now(); const r=await svc.detect(work,{maxSideLength:960}); detMs=performance.now()-t0;
  return lineBoxes(r.boxes||[]).map(b=>mkLine(b,sc));
}
async function freeze(el,w,h,info){
  photoInfo=info||'';
  if(!svc) return;
  busy=true;
  const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(el,0,0,w,h);
  stillCv=c; mode='still'; sizeCanvases(w,h); sctx.drawImage(c,0,0); updBar();
  statusEl.textContent='검출 중…';
  try{ currentLines=await detectStill(c); setStat(`검출 ${detMs.toFixed(0)} ms · 줄 ${currentLines.length}개`); }
  catch(e){ currentLines=[]; statusEl.textContent='검출 오류: '+e.message; }
  draw(); busy=false;
  if(stream){ $('btnShoot').style.display='none'; $('btnRetake').style.display=''; }
}
function shoot(){
  if(mode==='live' && vid.videoWidth) return freeze(vid,vid.videoWidth,vid.videoHeight);
  if(mode==='still' && stillCv) return freeze(stillCv,stillCv.width,stillCv.height); // re-run on the current still
}
function retake(){ mode='live'; currentLines=[]; prevBlocks=[]; octx.clearRect(0,0,ov.width,ov.height);
  $('btnShoot').style.display=''; $('btnRetake').style.display='none'; statusEl.textContent='카메라 미리보기. 글자를 맞추고 [찍기]를 누르세요.'; }
// Native camera / file: decode with EXIF orientation, cap long side at 4000
async function loadFile(file){
  stopCam(); mode='none'; $('nativeTxt').textContent='다시 찍기';
  let bm;
  try{ bm=await createImageBitmap(file,{imageOrientation:'from-image'}); }
  catch(e){ bm=await new Promise((ok,no)=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=()=>no(new Error('이미지 디코딩 실패')); im.src=URL.createObjectURL(file); }); }
  const W=bm.width||bm.naturalWidth, H=bm.height||bm.naturalHeight, k=Math.min(1,4000/Math.max(W,H));
  const w=Math.round(W*k), h=Math.round(H*k);
  await freeze(bm,w,h,'사진 '+w+'×'+h);
}
$('native').onchange=e=>{ const f=e.target.files[0]; if(f) loadFile(f).catch(er=>statusEl.textContent='사진 오류: '+er.message); e.target.value=''; };
$('btnShoot').onclick=shoot; $('btnRetake').onclick=retake;

$('btnSample').onclick=()=>loadImage('sample.jpg');
$('file').onchange=e=>{ const f=e.target.files[0]; if(f) loadFile(f).catch(er=>statusEl.textContent='사진 오류: '+er.message); e.target.value=''; };
function loadImage(url){
  stopCam(); mode='none';
  const im=new Image(); im.onload=()=>freeze(im,im.naturalWidth,im.naturalHeight);
  im.onerror=()=>statusEl.textContent='이미지를 불러오지 못했습니다.';
  im.src=url;
}
$('btnCam').onclick=async()=>{
  try{
    if(!navigator.mediaDevices?.getUserMedia) throw new Error('이 브라우저는 카메라를 지원하지 않습니다 (HTTPS 필요)');
    stopCam();
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:false});
    vid.srcObject=stream; await vid.play(); $('camctl').style.display='';
    sizeCanvases(vid.videoWidth,vid.videoHeight); retake();
  }catch(e){ statusEl.textContent='카메라 오류: '+(e.message||e.name)+' (권한을 확인하세요)'; }
};

// Preview loop (+ optional experimental live line boxes)
async function loop(){
  requestAnimationFrame(loop);
  if(mode!=='live'||!vid.videoWidth) return;
  if(vid.videoWidth!==srcW||vid.videoHeight!==srcH) sizeCanvases(vid.videoWidth,vid.videoHeight);
  sctx.drawImage(vid,0,0);
  if(!$('chkLive').checked||busy||!svc) { if(!$('chkLive').checked) octx.clearRect(0,0,ov.width,ov.height); return; }
  busy=true;
  try{
    const sc=1280/srcW; work.width=1280; work.height=Math.round(srcH*sc); wctx.drawImage(vid,0,0,work.width,work.height);
    const t0=performance.now(); const r=await svc.detect(work,{maxSideLength:640}); detMs=performance.now()-t0;
    if(mode==='live'){ currentLines=lineBoxes(r.boxes||[]).map(b=>mkLine(b,sc));
      const now=performance.now(); if(lastT) fps=fps?fps*0.7+0.3*1000/(now-lastT):1000/(now-lastT); lastT=now; draw();
      statusEl.textContent=`검출 ${detMs.toFixed(0)} ms · ${fps.toFixed(1)} fps · 줄 ${currentLines.length}개`; }
  }catch(e){ statusEl.textContent='검출 오류: '+e.message; }
  busy=false;
}
let ptr=null;
function draw(){
  octx.clearRect(0,0,ov.width,ov.height);
  const k=ov.width/(ov.getBoundingClientRect().width||ov.width); // source px per CSS px
  octx.lineWidth=1.5*k; octx.font=`bold ${15*k}px sans-serif`;
  const first={};
  currentLines.forEach(l=>{ const s=l;
    if(l.sel){ octx.fillStyle='rgba(60,160,255,0.38)'; octx.strokeStyle='#4af'; }
    else if(l.added){ octx.fillStyle='rgba(255,170,0,0.28)'; octx.strokeStyle='#fa0'; if(!first[l.added]||l.y<first[l.added].y) first[l.added]=l; }
    else { octx.fillStyle='rgba(0,0,0,0)'; octx.strokeStyle='rgba(0,255,0,0.55)'; }
    octx.fillRect(s.x,s.y,s.width,s.height); octx.strokeRect(s.x,s.y,s.width,s.height); });
  for(const [num,l] of Object.entries(first)){ octx.fillStyle='#fff'; octx.strokeStyle='#000'; octx.lineWidth=3*k; octx.strokeText(num,l.x+2*k,l.y-3*k); octx.fillText(num,l.x+2*k,l.y-3*k); }
  if(ptr&&ptr.drag){ const a=ptr.a,b=ptr.b; octx.lineWidth=2*k; octx.fillStyle='rgba(80,160,255,0.22)'; octx.strokeStyle='#8cf';
    octx.fillRect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(a.x-b.x),Math.abs(a.y-b.y)); octx.strokeRect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(a.x-b.x),Math.abs(a.y-b.y)); }
}
// Pointer selection on the frozen still (CSS px -> source px by ratio)
const toSrc=e=>{ const r=ov.getBoundingClientRect(); return {x:(e.clientX-r.left)*srcW/r.width,y:(e.clientY-r.top)*srcH/r.height,cx:e.clientX,cy:e.clientY}; };
ov.addEventListener('pointerdown',e=>{ if(mode!=='still') return; try{ov.setPointerCapture(e.pointerId);}catch(_){} ptr={a:toSrc(e),b:toSrc(e),drag:false}; });
ov.addEventListener('pointermove',e=>{ if(!ptr) return; ptr.b=toSrc(e); if(!ptr.drag&&Math.hypot(ptr.b.cx-ptr.a.cx,ptr.b.cy-ptr.a.cy)>=10) ptr.drag=true; if(ptr.drag) draw(); });
ov.addEventListener('pointerup',e=>{ if(!ptr) return; const p=ptr; p.b=toSrc(e); ptr=null;
  if(p.drag) selectRect(p.a.x,p.a.y,p.b.x,p.b.y); else tapAt(p.a.x,p.a.y); });
ov.addEventListener('pointercancel',()=>{ ptr=null; draw(); });
function tapAt(px,py){ let hit=null,ha=Infinity;
  for(const l of currentLines){ const p=0.3*l.height; if(px>=l.x-p&&px<=l.x+l.width+p&&py>=l.y-p&&py<=l.y+l.height+p&&l.width*l.height<ha){ha=l.width*l.height;hit=l;} }
  if(hit){ hit.sel=!hit.sel; } draw(); updBar(); }
function selectRect(x0,y0,x1,y1){
  const rx0=Math.min(x0,x1),rx1=Math.max(x0,x1),ry0=Math.min(y0,y1),ry1=Math.max(y0,y1);
  for(const l of currentLines){
    const iw=Math.min(rx1,l.x+l.width)-Math.max(rx0,l.x), ih=Math.min(ry1,l.y+l.height)-Math.max(ry0,l.y);
    const area=iw>0&&ih>0?iw*ih:0, cy=l.y+l.height/2;
    l.sel = area>=0.4*l.width*l.height || (cy>=ry0&&cy<=ry1&&iw>=0.5*l.width);
  }
  draw(); updBar();
}
function updBar(){ const n=currentLines.filter(l=>l.sel).length; $('selbar').style.display=n?'':'none'; $('selN').textContent=n; }
$('btnDesel').onclick=()=>{ currentLines.forEach(l=>l.sel=false); draw(); updBar(); };
$('btnAdd').onclick=()=>addSelection();

// ===== Job queue =====
let jobN=0, lastReport=null; const jobs=[]; let running=false; const texts=[];
function render(){ out.value=texts.map(t=>t.text??t.ph).join('\n'); }
function addSelection(){
  const ls=currentLines.filter(l=>l.sel); if(!ls.length||mode!=='still') return;
  if(ls.some(l=>l.added)) toast('이미 추가한 줄 포함');
  const prev=ls.map(l=>l.added), num=++addedN;
  ls.forEach(l=>{ l.added=num; l.sel=false; }); draw(); updBar();
  const id=++jobN, entry={id,ph:`[인식 중 #${id}]`,text:null,lines:ls,prev};
  texts.push(entry); render(); jobs.push({entry,lines:ls}); pump();
}
function tapBlock(i){ const l=currentLines[i]; if(!l) return; currentLines.forEach(x=>x.sel=false); l.sel=true; addSelection(); }
async function pump(){
  if(running) return; running=true;
  while(jobs.length){
    const {entry,lines}=jobs.shift();
    if(!texts.includes(entry)) continue;
    const t0=performance.now(), eg=effEngine(), lbl=eg.name==='google'?'Google 인식':'로컬 인식';
    try{
      const prep=prepareForOcr(stillCv,lines,{fix:$('chkFix').checked}); lastReport=prep.report;
      $('thumb').src=prep.canvas.toDataURL('image/jpeg',0.7); $('chip').textContent=prep.report.text;
      const keep=(qx,qy)=>{ const p=prep.transform.toStill(qx,qy); return lines.some(l=>{ const px=0.5*l.height; return p.x>=l.x-px&&p.x<=l.x+l.width+px&&p.y>=l.y-0.15*l.height&&p.y<=l.y+1.15*l.height; }); };
      entry.text=assemble(await eg.recognize(prep.canvas,{keep}),prep.canvas.width);
      $('jobinfo').textContent=`#${entry.id} ${lbl} ${(performance.now()-t0).toFixed(0)} ms`;
      $('glare').style.display=prep.report.glare?'block':'none';
    }
    catch(e){ entry.text=`[실패 #${entry.id}]`; $('jobinfo').textContent=(eg.name==='google'?'Google OCR 실패: ':'인식 실패: ')+e.message; }
    render();
  }
  running=false;
}
function assemble(res,cw){
  if(!res.length) return '';
  // box coords may be in a resized space, so use detected text extent for the 8% zone
  const L=Math.min(...res.map(r=>r.box.x)), R=Math.max(...res.map(r=>r.box.x+r.box.width));
  const items=res.filter(r=>!(/^\d{1,3}$/.test(r.text.trim()) && r.box.x+r.box.width/2<L+(R-L)*0.08+r.box.width));
  items.sort((a,b)=>(a.box.y+a.box.height/2)-(b.box.y+b.box.height/2));
  const rows=[];
  for(const it of items){
    const cy=it.box.y+it.box.height/2, row=rows[rows.length-1];
    if(row && Math.abs(cy-row.cy)<=it.box.height/2){ row.items.push(it); row.cy=(row.cy*(row.items.length-1)+cy)/row.items.length; }
    else rows.push({cy,items:[it]});
  }
  return rows.map(r=>r.items.sort((a,b)=>a.box.x-b.box.x).map(i=>i.text).join(' ')).join('\n');
}
$('btnCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(out.value); toast('복사했습니다.'); }catch(e){ toast('복사 실패: '+e.message); } };
$('btnUndo').onclick=()=>{ const t=texts.pop(); if(t){ t.lines.forEach((l,i)=>l.added=t.prev[i]); } render(); if(mode==='still') draw(); };
$('btnClear').onclick=()=>{ texts.length=0; jobs.length=0; currentLines.forEach(b=>{b.added=0;b.sel=false;}); addedN=0; render(); updBar(); if(mode==='still') draw(); };

window.__spike={ setEngine, loadFile, getLines:()=>currentLines, getBlocks:()=>currentLines, selectRect, addSelection, tapBlock, shoot, getText:()=>out.value, lastReport:()=>lastReport, stats:()=>({detMs,fps,blocks:currentLines.length}) };
try{ svc=new PaddleOcrService(); await svc.initialize(); statusEl.textContent='준비 완료. 카메라 또는 이미지를 선택하세요.'; window.__spikeReady=true; loop(); }
catch(e){ statusEl.textContent='모델 초기화 실패: '+e.message; }
</script></body></html>
